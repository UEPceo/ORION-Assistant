name: ORION quality checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: orion-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-robolectric:
    name: Unit tests and Robolectric
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Android instrumentation tests
        timeout-minutes: 10
        env:
          CI: true
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 compileDebugAndroidTestKotlin
      - name: Run unit tests and Robolectric
        timeout-minutes: 50
        env:
          CI: true
        run: |
          chmod +x ./gradlew
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            ./gradlew --no-daemon --stacktrace --max-workers=2 testDebugUnitTest 2>&1 | tee -a unit-tests.log
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then exit 0; fi
            if grep -q "Received status code 429" unit-tests.log && [[ "$attempt" -lt 3 ]]; then
              echo "Maven Central rate-limited the request; retrying after backoff (attempt $attempt/3)."
              sleep $((attempt * 45))
              continue
            fi
            exit "$status"
          done
          exit 1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORION-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            unit-tests.log
          if-no-files-found: warn
          retention-days: 14

  minified-release-smoke:
    name: R8 minified release and JNI packaging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble minified release
        timeout-minutes: 45
        env:
          CI: true
        run: |
          chmod +x ./gradlew
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            ./gradlew --no-daemon --stacktrace --max-workers=2 assembleRelease 2>&1 | tee -a release-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then exit 0; fi
            if grep -q "Received status code 429" release-build.log && [[ "$attempt" -lt 3 ]]; then
              echo "Maven Central rate-limited the request; retrying after backoff (attempt $attempt/3)."
              sleep $((attempt * 45))
              continue
            fi
            exit "$status"
          done
          exit 1
      - name: Verify R8 mapping and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -l "$APK" | tee release-apk-contents.txt
          grep -Eq 'lib/arm64-v8a/[^ ]+\.so' release-apk-contents.txt
          grep -Eq 'lib/x86_64/[^ ]+\.so' release-apk-contents.txt
      - name: Upload minified release smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORION-release-minified-smoke
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            release-apk-contents.txt
          if-no-files-found: error
          retention-days: 14
