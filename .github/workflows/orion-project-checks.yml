name: ORION isolated project checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orion-project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        if: hashFiles('gradlew') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detect project types
        id: detect
        shell: bash
        run: |
          echo "android=$([[ -f gradlew ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([[ -f pyproject.toml || -f pytest.ini || -f requirements.txt ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "node=$([[ -f package.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Python tests
        if: steps.detect.outputs.python == 'true'
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          if [[ -f pyproject.toml ]]; then pip install -e .; fi
          pip install pytest
          pytest -q
      - name: Node checks
        if: steps.detect.outputs.node == 'true'
        timeout-minutes: 10
        run: |
          if [[ -f package-lock.json ]]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          node -e "const p=require('./package.json'); if(p.scripts?.test) process.exit(0); process.exit(2)" || {
            echo "package.json has no test script; skip Node tests."
            exit 0
          }
          npm test
