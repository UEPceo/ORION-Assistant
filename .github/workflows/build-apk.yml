name: Build APK (debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: orion-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile ORION debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORION_GITHUB_CLIENT_ID: ${{ secrets.ORION_GITHUB_CLIENT_ID || vars.ORION_GITHUB_CLIENT_ID }}
      ORION_DEBUG_KEYSTORE_BASE64: ${{ secrets.ORION_DEBUG_KEYSTORE_BASE64 }}
      ORION_DEBUG_STORE_PASSWORD: ${{ secrets.ORION_DEBUG_STORE_PASSWORD }}
      ORION_DEBUG_KEY_ALIAS: ${{ secrets.ORION_DEBUG_KEY_ALIAS }}
      ORION_DEBUG_KEY_PASSWORD: ${{ secrets.ORION_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure optional connector credentials and stable CI signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ORION_GITHUB_CLIENT_ID" ]]; then
            echo "::warning::ORION_GITHUB_CLIENT_ID is not configured; the APK will build, but GitHub authorization will remain unavailable until the public GitHub App client ID is configured."
          else
            echo "GitHub Device Flow client ID is configured."
          fi

          signing_values=("$ORION_DEBUG_KEYSTORE_BASE64" "$ORION_DEBUG_STORE_PASSWORD" "$ORION_DEBUG_KEY_ALIAS" "$ORION_DEBUG_KEY_PASSWORD")
          configured_count=0
          for value in "${signing_values[@]}"; do
            [[ -n "$value" ]] && configured_count=$((configured_count + 1))
          done

          if [[ "$configured_count" -eq 0 ]]; then
            echo "::warning::Stable CI debug signing is not configured. Gradle will use its generated debug key; Gmail OAuth will not work in this CI APK until its signing certificate SHA-1 is registered with Google."
          elif [[ "$configured_count" -ne 4 ]]; then
            echo "::error::Configure all four ORION_DEBUG_* signing secrets together, or leave all four empty."
            exit 1
          else
            KEYSTORE_PATH="$RUNNER_TEMP/orion-ci-debug.keystore"
            printf '%s' "$ORION_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ORION_DEBUG_STORE_PASSWORD" -alias "$ORION_DEBUG_KEY_ALIAS" | grep -E "Alias name:|SHA1:"
            echo "ORION_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify build environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=2 assembleDebug 2>&1 | tee build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ORION-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ORION-build-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 14
